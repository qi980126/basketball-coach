<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>篮球教练计分系统</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary: #FF6B35;
      --primary-light: #FF8C5A;
      --success: #10B981;
      --success-light: #34D399;
      --danger: #EF4444;
      --warning: #F59E0B;
      --info: #3B82F6;
      --bg-primary: #0F172A;
      --bg-secondary: #1E293B;
      --bg-card: #334155;
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --border: #475569;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    .app { min-height: 100vh; display: flex; flex-direction: column; }

    .app-header {
      background: var(--bg-secondary);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      border-bottom: 1px solid var(--border);
    }

    .app-header h1 { font-size: 1.5rem; color: var(--primary); }

    .nav-tabs { display: flex; gap: 0.5rem; flex: 1; }

    .nav-tabs button {
      background: transparent;
      color: var(--text-secondary);
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-tabs button:hover { background: var(--bg-card); color: var(--text-primary); }
    .nav-tabs button.active { background: var(--primary); color: white; }

    .btn-reset { background: var(--danger); color: white; padding: 0.5rem 1rem; border: none; border-radius: 6px; font-size: 0.9rem; cursor: pointer; }

    .app-main { flex: 1; padding: 1.5rem; overflow-y: auto; }

    button { cursor: pointer; border: none; font-weight: 600; transition: all 0.2s; }
    button:active { transform: scale(0.98); }

    input, select {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.5rem;
      border-radius: 6px;
      font-size: 14px;
    }

    input:focus, select:focus { outline: none; border-color: var(--primary); }

    .btn-primary { background: var(--primary); color: white; padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.9rem; }
    .btn-primary:hover { background: var(--primary-light); }
    .btn-secondary { background: var(--bg-card); color: var(--text-secondary); padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.9rem; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }

    .modal { background: var(--bg-secondary); padding: 2rem; border-radius: 12px; width: 400px; max-width: 90%; }
    .modal h3 { margin-bottom: 1.5rem; color: var(--text-primary); }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.9rem; }
    .form-group input, .form-group select { width: 100%; padding: 0.75rem; font-size: 1rem; }

    .form-actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
    .form-actions button { flex: 1; padding: 0.75rem; }

    /* Player Manager */
    .player-manager { background: var(--bg-secondary); border-radius: 12px; padding: 1.5rem; height: 100%; }
    .manager-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .manager-header h2 { font-size: 1.5rem; color: var(--text-primary); }

    .player-list { overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; }
    .empty-message { text-align: center; color: var(--text-secondary); padding: 2rem; }

    .player-card {
      display: flex; align-items: center;
      background: var(--bg-card);
      padding: 1rem; border-radius: 8px; gap: 1rem; transition: all 0.2s;
    }

    .player-card.playing { border: 2px solid var(--primary); background: rgba(255, 107, 53, 0.1); }

    .player-number { font-size: 1.5rem; font-weight: bold; color: var(--primary); min-width: 60px; }
    .player-info { flex: 1; }
    .player-name { font-size: 1rem; font-weight: 600; margin-bottom: 0.25rem; }
    .player-position { font-size: 0.8rem; color: var(--text-secondary); }

    .player-actions { display: flex; gap: 0.5rem; }

    .btn-toggle { background: var(--bg-primary); color: var(--text-secondary); padding: 0.5rem 0.75rem; border-radius: 4px; font-size: 1rem; }
    .btn-toggle.active { background: var(--success); color: white; }

    .btn-edit { background: var(--primary); color: white; padding: 0.5rem 0.75rem; border-radius: 4px; font-size: 0.85rem; }
    .btn-delete { background: var(--danger); color: white; padding: 0.5rem 0.75rem; border-radius: 4px; font-size: 0.85rem; }

    /* Game Board */
    .game-board { flex: 1; display: flex; flex-direction: column; gap: 1.5rem; }

    .game-header { background: var(--bg-secondary); border-radius: 12px; padding: 1.5rem; }

    .score-board { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
    .team-score { flex: 1; text-align: center; }
    .team-label { font-size: 1rem; color: var(--text-secondary); margin-bottom: 0.5rem; }
    .score { font-size: 4rem; font-weight: bold; }
    .home .score { color: var(--primary); }
    .away .score { color: var(--text-secondary); }

    .game-info { text-align: center; }
    .quarter { font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 0.5rem; }
    .time { font-size: 2.5rem; font-weight: bold; color: var(--text-primary); font-variant-numeric: tabular-nums; }

    .team-stats-inline { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .quarter-stats-mini { background: var(--bg-card); padding: 0.5rem 0.75rem; border-radius: 6px; border: 1px solid var(--border); flex: 1; min-width: 140px; }
    .quarter-stats-mini.current { border: 2px solid var(--primary); background: rgba(255, 107, 53, 0.1); }
    .q-label { font-size: 0.75rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.25rem; }
    .q-data { font-size: 0.7rem; color: var(--text-secondary); }
    .q-total { font-size: 0.65rem; color: var(--primary); font-weight: 600; margin-top: 0.15rem; }

    .game-controls { display: flex; gap: 1rem; justify-content: center; }

    .btn-start { background: var(--success); color: white; padding: 0.75rem 2rem; border-radius: 8px; font-size: 1.1rem; }
    .btn-pause { background: var(--warning); color: #000; padding: 0.75rem 1.5rem; border-radius: 8px; font-size: 1rem; }
    .btn-next { background: var(--info); color: white; padding: 0.75rem 1.5rem; border-radius: 8px; font-size: 1rem; }
    .btn-undo { background: #8B5CF6; color: white; padding: 0.75rem 1.5rem; border-radius: 8px; font-size: 1rem; }
    .btn-end { background: var(--danger); color: white; padding: 0.75rem 1.5rem; border-radius: 8px; font-size: 1rem; }
    .btn-export { background: var(--primary); color: white; padding: 0.75rem 1.5rem; border-radius: 8px; font-size: 1rem; }

    .game-content { flex: 1; display: flex; gap: 1.5rem; }

    .active-players-section { flex: 1; background: var(--bg-secondary); border-radius: 12px; padding: 1.5rem; overflow-y: auto; }
    .active-players-section h3 { margin-bottom: 1rem; color: var(--text-primary); }

    .players-grid { display: flex; flex-direction: column; gap: 1rem; }

    .player-game-card { background: var(--bg-card); border-radius: 6px; padding: 0.75rem; }
    
    .player-header-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
    .player-header-row .player-number { font-size: 1.1rem; min-width: 40px; }
    .player-header-row .player-name { flex: 1; font-size: 0.95rem; font-weight: 600; }
    .player-points { font-size: 1rem; font-weight: bold; color: var(--primary); background: rgba(255, 107, 53, 0.2); padding: 0.15rem 0.5rem; border-radius: 4px; }
    
    .realtime-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; margin-bottom: 0.75rem; }
    .stat-item { text-align: center; padding: 0.5rem; background: var(--bg-primary); border-radius: 4px; }
    .stat-item .stat-value { font-size: 1.1rem; font-weight: bold; color: var(--text-primary); }
    .stat-item .stat-label { font-size: 0.7rem; color: var(--text-secondary); margin-top: 0.25rem; }
    .stat-item.highlight { background: rgba(255, 107, 53, 0.2); }
    .stat-item.highlight .stat-value { color: var(--primary); }
    .stat-item.good { background: rgba(16, 185, 129, 0.2); }
    .stat-item.good .stat-value { color: var(--success); }
    .stat-item.warning { background: rgba(245, 158, 11, 0.2); }
    .stat-item.warning .stat-value { color: var(--warning); }

    .advanced-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 1rem; padding: 0.75rem; background: rgba(59, 130, 246, 0.1); border-radius: 6px; }
    .advanced-stats .stat-item .stat-value { font-size: 0.95rem; }
    .advanced-stats .stat-item .stat-label { font-size: 0.65rem; }

    .event-buttons { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.3rem; }
    .event-btn { padding: 0.5rem 0.2rem; border-radius: 4px; color: white; font-size: 0.7rem; font-weight: 600; }
    .event-btn.success { background: var(--success); }
    .event-btn.danger { background: var(--danger); }
    .event-btn.neutral { background: var(--border); }
    .event-btn.warning { background: var(--warning); color: #000; }
    
    .player-quick-stats { display: flex; gap: 0.5rem; margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--text-secondary); flex-wrap: wrap; }
    .player-quick-stats span { display: flex; align-items: center; gap: 0.15rem; }
    .player-quick-stats .stat-good { color: var(--success); }
    .player-quick-stats .stat-bad { color: var(--danger); }

    .opponent-section { width: 180px; background: var(--bg-secondary); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; }
    .opponent-section h3 { margin-bottom: 1rem; color: var(--text-primary); }
    .opponent-buttons { display: flex; flex-direction: column; gap: 0.75rem; }
    .opponent-btn { background: var(--border); color: white; padding: 1rem; border-radius: 8px; font-size: 1rem; font-weight: 600; }
    .opponent-btn:hover { background: var(--text-secondary); }

    .game-log-section { margin-top: 1.5rem; }
    .game-log-section h4 { margin-bottom: 0.75rem; color: var(--text-primary); font-size: 1rem; }
    .game-log-list { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; }
    .log-item { background: var(--bg-card); padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.85rem; display: flex; gap: 0.5rem; align-items: flex-start; }
    .log-time { color: var(--text-secondary); font-weight: 600; white-space: nowrap; }
    .log-text { color: var(--text-primary); flex: 1; }
    .log-score { border-left: 3px solid var(--success); }
    .log-miss { border-left: 3px solid var(--danger); }
    .log-rebound { border-left: 3px solid var(--primary); }
    .log-assist { border-left: 3px solid var(--info); }
    .log-steal { border-left: 3px solid var(--warning); }
    .log-block { border-left: 3px solid var(--accent); }
    .log-turnover { border-left: 3px solid var(--warning); }
    .log-foul { border-left: 3px solid var(--warning); }
    .log-opponent { border-left: 3px solid var(--danger); }
    .log-empty { text-align: center; color: var(--text-secondary); padding: 1rem; font-size: 0.85rem; }

    /* Court View */
    .court-panel { background: var(--bg-secondary); border-radius: 12px; padding: 1.5rem; }
    .court-panel h2 { margin-bottom: 1rem; color: var(--text-primary); }

    .court-container { display: flex; gap: 2rem; flex-wrap: wrap; }
    
    .court-svg-container { flex: 1; min-width: 500px; }
    
    .court-stats { width: 300px; }
    .court-stats h3 { margin-bottom: 1rem; color: var(--text-primary); font-size: 1.1rem; }
    .zone-stats { display: flex; flex-direction: column; gap: 0.75rem; }
    .zone-stat { background: var(--bg-card); padding: 1rem; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .zone-stat .zone-name { font-weight: 600; }
    .zone-stat .zone-data { text-align: right; }
    .zone-stat .zone-makes { font-size: 1.2rem; font-weight: bold; color: var(--primary); }
    .zone-stat .zone-percent { font-size: 0.9rem; color: var(--text-secondary); }

    .player-score-list { display: flex; flex-direction: column; gap: 0.5rem; max-height: 400px; overflow-y: auto; }
    .player-score-item { background: var(--bg-card); padding: 0.75rem; border-radius: 6px; display: flex; align-items: center; gap: 0.75rem; }
    .player-rank { font-size: 0.85rem; font-weight: bold; color: var(--text-secondary); min-width: 30px; }
    .player-info-inline { flex: 1; display: flex; gap: 0.5rem; }
    .player-num { font-weight: bold; color: var(--primary); font-size: 0.9rem; }
    .player-nm { color: var(--text-primary); font-size: 0.9rem; }
    .player-score-detail { text-align: right; }
    .total-pts { font-size: 1.1rem; font-weight: bold; color: var(--success); display: block; }
    .score-breakdown { font-size: 0.75rem; color: var(--text-secondary); }
    .score-breakdown span { margin-left: 0.25rem; }
    .two-pt { color: var(--success); }
    .three-pt { color: var(--primary); }
    .ft-pt { color: var(--info); }

    /* Stats Panel */
    .stats-panel { background: var(--bg-secondary); border-radius: 12px; padding: 1.5rem; overflow: hidden; }
    .stats-panel h2 { margin-bottom: 1.5rem; color: var(--text-primary); }

    .stats-table-wrapper { overflow-x: auto; }
    .stats-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .stats-table th, .stats-table td { padding: 0.6rem 0.4rem; text-align: center; border-bottom: 1px solid var(--border); }
    .stats-table th { background: var(--bg-card); color: var(--text-secondary); font-weight: 600; }
    .stats-table td { color: var(--text-primary); }
    .stats-table tbody tr:hover { background: rgba(255, 255, 255, 0.05); }
    .player-cell { font-weight: 600; color: var(--primary); }
    .highlight { font-weight: bold; color: var(--success); }
    .negative { color: var(--danger); }
    .advanced-header { background: rgba(59, 130, 246, 0.2) !important; }

    @media (max-width: 768px) {
      .app-header { flex-direction: column; gap: 1rem; }
      .nav-tabs { width: 100%; justify-content: center; }
      .app-main { padding: 1rem; }
      .game-content { flex-direction: column; }
      .opponent-section { width: 100%; }
      .event-buttons { grid-template-columns: repeat(4, 1fr); }
      .realtime-stats { grid-template-columns: repeat(3, 1fr); }
      .advanced-stats { grid-template-columns: repeat(2, 1fr); }
      .court-container { flex-direction: column; }
      .court-stats { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const EventType = {
      TWO_POINT_MADE: 'two_point_made',
      TWO_POINT_MISS: 'two_point_miss',
      THREE_POINT_MADE: 'three_point_made',
      THREE_POINT_MISS: 'three_point_miss',
      FREE_THROW_MADE: 'free_throw_made',
      FREE_THROW_MISS: 'free_throw_miss',
      OFFENSIVE_REBOUND: 'offensive_rebound',
      DEFENSIVE_REBOUND: 'defensive_rebound',
      ASSIST: 'assist',
      STEAL: 'steal',
      BLOCK: 'block',
      TURNOVER: 'turnover',
      FOUL: 'foul',
    };

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function createEmptyStats(playerId) {
      return {
        playerId,
        twoPointMade: 0,
        twoPointAttempt: 0,
        threePointMade: 0,
        threePointAttempt: 0,
        freeThrowMade: 0,
        freeThrowAttempt: 0,
        offensiveRebound: 0,
        defensiveRebound: 0,
        assist: 0,
        steal: 0,
        block: 0,
        turnover: 0,
        foul: 0,
        paintMakes: 0,
        paintAttempts: 0,
        midRangeMakes: 0,
        midRangeAttempts: 0,
      };
    }

    function calculateTotalPoints(stats) {
      return stats.twoPointMade * 2 + stats.threePointMade * 3 + stats.freeThrowMade;
    }

    function calculatePercentage(made, attempted) {
      if (attempted === 0) return '0.0';
      return ((made / attempted) * 100).toFixed(1);
    }

    function calculateFieldGoalPercentage(stats) {
      const made = stats.twoPointMade + stats.threePointMade;
      const attempted = stats.twoPointAttempt + stats.threePointAttempt;
      return calculatePercentage(made, attempted);
    }

    function calculateTotalRebounds(stats) {
      return stats.offensiveRebound + stats.defensiveRebound;
    }

    // 高级统计指标
    function calculateEFG(stats) {
      // 有效命中率 = (命中数 + 0.5 * 三分命中数) / 出手数
      const made = stats.twoPointMade + stats.threePointMade;
      const attempted = stats.twoPointAttempt + stats.threePointAttempt;
      if (attempted === 0) return '0.0';
      const efg = ((made + 0.5 * stats.threePointMade) / attempted) * 100;
      return efg.toFixed(1);
    }

    function calculateTurnoverRate(stats) {
      // 失误率 = 失误数 / (投篮出手 + 0.44 * 罚球出手 + 失误)
      const fgAttempts = stats.twoPointAttempt + stats.threePointAttempt;
      const possessions = fgAttempts + 0.44 * stats.freeThrowAttempt + stats.turnover;
      if (possessions === 0) return '0.0';
      return ((stats.turnover / possessions) * 100).toFixed(1);
    }

    function calculateOffensiveReboundRate(stats) {
      // 进攻篮板率 = 进攻篮板 / 总篮板
      const totalReb = calculateTotalRebounds(stats);
      if (totalReb === 0) return '0.0';
      return ((stats.offensiveRebound / totalReb) * 100).toFixed(1);
    }

    function calculateFreeThrowRate(stats) {
      // 罚球率 = 罚球出手 / 投篮出手
      const fgAttempts = stats.twoPointAttempt + stats.threePointAttempt;
      if (fgAttempts === 0) return '0.00';
      return (stats.freeThrowAttempt / fgAttempts).toFixed(2);
    }

    let state = {
      view: 'setup',
      players: [],
      playerStats: new Map(),
      events: [],
      isPlaying: false,
      isPaused: false,
      currentQuarter: 1,
      timeRemaining: 600,
      homeScore: 0,
      awayScore: 0,
      totalGameTime: 0,
      quarterStats: [
        { rebounds: 0, assists: 0, turnovers: 0, fouls: 0 },
        { rebounds: 0, assists: 0, turnovers: 0, fouls: 0 },
        { rebounds: 0, assists: 0, turnovers: 0, fouls: 0 },
        { rebounds: 0, assists: 0, turnovers: 0, fouls: 0 },
      ],
      homeTeamName: '我方',
      awayTeamName: '对方',
    };

    let timerInterval = null;
    let showModal = false;
    let editingPlayer = null;
    let formData = { name: '', number: '', position: 'PG' };

    function editTeamName(team) {
      const newName = prompt('请输入球队名称:', team === 'home' ? state.homeTeamName : state.awayTeamName);
      if (newName && newName.trim()) {
        if (team === 'home') {
          state.homeTeamName = newName.trim();
        } else {
          state.awayTeamName = newName.trim();
        }
        render();
      }
    }

    function exportToExcel() {
      const data = state.players.map(player => {
        const stats = state.playerStats.get(player.id) || createEmptyStats(player.id);
        return {
          '球衣号码': player.number,
          '球员姓名': player.name,
          '位置': player.position,
          '得分': calculateTotalPoints(stats),
          '2分命中': stats.twoPointMade,
          '2分出手': stats.twoPointAttempt,
          '2分命中率(%)': calculatePercentage(stats.twoPointMade, stats.twoPointAttempt),
          '3分命中': stats.threePointMade,
          '3分出手': stats.threePointAttempt,
          '3分命中率(%)': calculatePercentage(stats.threePointMade, stats.threePointAttempt),
          '罚球命中': stats.freeThrowMade,
          '罚球出手': stats.freeThrowAttempt,
          '罚球命中率(%)': calculatePercentage(stats.freeThrowMade, stats.freeThrowAttempt),
          '投篮命中率(%)': calculateFieldGoalPercentage(stats),
          '有效命中率(%)': calculateEFG(stats),
          '失误率(%)': calculateTurnoverRate(stats),
          '进攻篮板率(%)': calculateOffensiveReboundRate(stats),
          '罚球率': calculateFreeThrowRate(stats),
          '进攻篮板': stats.offensiveRebound,
          '防守篮板': stats.defensiveRebound,
          '总篮板': calculateTotalRebounds(stats),
          '助攻': stats.assist,
          '抢断': stats.steal,
          '盖帽': stats.block,
          '失误': stats.turnover,
          '犯规': stats.foul,
        };
      });

      const summaryData = [
        { '项目': '我方得分', '数值': state.homeScore },
        { '项目': '对方得分', '数值': state.awayScore },
        { '项目': '比赛时长(秒)', '数值': state.totalGameTime },
      ];

      const wb = XLSX.utils.book_new();
      const ws1 = XLSX.utils.json_to_sheet(data);
      const ws2 = XLSX.utils.json_to_sheet(summaryData);

      XLSX.utils.book_append_sheet(wb, ws1, '球员统计');
      XLSX.utils.book_append_sheet(wb, ws2, '比赛总结');

      XLSX.writeFile(wb, `篮球比赛统计_${new Date().toLocaleDateString('zh-CN')}.xlsx`);
    }

    function handleRecordEvent(playerId, eventType) {
      let stats = state.playerStats.get(playerId);
      if (!stats) {
        stats = createEmptyStats(playerId);
      } else {
        stats = { ...stats };
      }

      const previousState = {
        playerId,
        eventType,
        stats: { ...state.playerStats.get(playerId) || createEmptyStats(playerId) },
        homeScore: state.homeScore,
        quarterStats: JSON.parse(JSON.stringify(state.quarterStats)),
      };

      switch (eventType) {
        case EventType.TWO_POINT_MADE:
          stats.twoPointMade += 1;
          stats.twoPointAttempt += 1;
          state.homeScore += 2;
          break;
        case EventType.TWO_POINT_MISS:
          stats.twoPointAttempt += 1;
          break;
        case EventType.THREE_POINT_MADE:
          stats.threePointMade += 1;
          stats.threePointAttempt += 1;
          state.homeScore += 3;
          break;
        case EventType.THREE_POINT_MISS:
          stats.threePointAttempt += 1;
          break;
        case EventType.FREE_THROW_MADE:
          stats.freeThrowMade += 1;
          stats.freeThrowAttempt += 1;
          state.homeScore += 1;
          break;
        case EventType.FREE_THROW_MISS:
          stats.freeThrowAttempt += 1;
          break;
        case EventType.OFFENSIVE_REBOUND:
          stats.offensiveRebound += 1;
          state.quarterStats[state.currentQuarter - 1].rebounds += 1;
          break;
        case EventType.DEFENSIVE_REBOUND:
          stats.defensiveRebound += 1;
          state.quarterStats[state.currentQuarter - 1].rebounds += 1;
          break;
        case EventType.ASSIST:
          stats.assist += 1;
          state.quarterStats[state.currentQuarter - 1].assists += 1;
          break;
        case EventType.STEAL:
          stats.steal += 1;
          break;
        case EventType.BLOCK:
          stats.block += 1;
          break;
        case EventType.TURNOVER:
          stats.turnover += 1;
          state.quarterStats[state.currentQuarter - 1].turnovers += 1;
          break;
        case EventType.FOUL:
          stats.foul += 1;
          state.quarterStats[state.currentQuarter - 1].fouls += 1;
          break;
      }

      const player = state.players.find(p => p.id === playerId);
      const eventText = getEventText(eventType, player);
      
      state.gameLog = state.gameLog || [];
      state.gameLog.unshift({
        time: `${state.currentQuarter}节 ${formatTime(state.timeRemaining)}`,
        text: eventText,
        type: eventType.includes('made') ? 'success' : eventType.includes('miss') || eventType.includes('turnover') || eventType.includes('foul') ? 'danger' : 'neutral'
      });
      
      if (state.gameLog.length > 30) {
        state.gameLog.pop();
      }
      
      state.playerStats.set(playerId, stats);
      
      state.eventHistory = state.eventHistory || [];
      state.eventHistory.push(previousState);
      if (state.eventHistory.length > 50) {
        state.eventHistory.shift();
      }
      
      render();
    }

    function getEventText(eventType, player) {
      const playerName = player ? `#${player.number} ${player.name}` : '';
      const eventMap = {
        [EventType.TWO_POINT_MADE]: `${playerName} 2分命中`,
        [EventType.TWO_POINT_MISS]: `${playerName} 2分不中`,
        [EventType.THREE_POINT_MADE]: `${playerName} 3分命中`,
        [EventType.THREE_POINT_MISS]: `${playerName} 3分不中`,
        [EventType.FREE_THROW_MADE]: `${playerName} 罚球命中`,
        [EventType.FREE_THROW_MISS]: `${playerName} 罚球不中`,
        [EventType.OFFENSIVE_REBOUND]: `${playerName} 进攻篮板`,
        [EventType.DEFENSIVE_REBOUND]: `${playerName} 防守篮板`,
        [EventType.ASSIST]: `${playerName} 助攻`,
        [EventType.STEAL]: `${playerName} 抢断`,
        [EventType.BLOCK]: `${playerName} 盖帽`,
        [EventType.TURNOVER]: `${playerName} 失误`,
        [EventType.FOUL]: `${playerName} 犯规`,
      };
      return eventMap[eventType] || '';
    }

    function handleUndo() {
      if (!state.eventHistory || state.eventHistory.length === 0) {
        alert('没有可撤销的操作');
        return;
      }

      const lastEvent = state.eventHistory.pop();
      
      if (lastEvent.eventType === 'opponent_score') {
        state.awayScore = lastEvent.awayScore;
      } else {
        if (lastEvent.playerId) {
          state.playerStats.set(lastEvent.playerId, lastEvent.stats);
        }
        state.homeScore = lastEvent.homeScore;
        state.quarterStats = lastEvent.quarterStats;
      }
      
      render();
    }

    function handleOpponentScore(points) {
      const previousState = {
        awayScore: state.awayScore,
        eventType: 'opponent_score',
      };
      
      state.awayScore += points;
      
      state.gameLog = state.gameLog || [];
      state.gameLog.unshift({
        time: `${state.currentQuarter}节 ${formatTime(state.timeRemaining)}`,
        text: `${state.awayTeamName} ${points}分`,
        type: 'opponent'
      });
      
      if (state.gameLog.length > 30) {
        state.gameLog.pop();
      }
      
      state.eventHistory = state.eventHistory || [];
      state.eventHistory.push(previousState);
      
      render();
    }

    function handleStartGame() {
      if (state.players.filter(p => p.isPlaying).length === 0) {
        alert('请至少选择一名上场球员');
        return;
      }
      
      if (!state.isPlaying) {
        state.isPlaying = true;
        state.isPaused = false;
        state.currentQuarter = 1;
        state.timeRemaining = 600;
        state.totalGameTime = 0;
        startTimer();
      } else {
        state.isPaused = false;
        startTimer();
      }
      
      state.view = 'game';
      render();
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (state.isPlaying && !state.isPaused) {
          state.timeRemaining -= 1;
          state.totalGameTime += 1;
          
          if (state.timeRemaining <= 0) {
            if (state.currentQuarter < 4) {
              state.currentQuarter += 1;
              state.timeRemaining = 600;
            } else {
              handleEndGame();
            }
          }
          render();
        }
      }, 1000);
    }

    function handlePauseGame() {
      state.isPaused = true;
      if (timerInterval) clearInterval(timerInterval);
      render();
    }

    function handleNextQuarter() {
      if (state.currentQuarter < 4) {
        state.currentQuarter += 1;
        state.timeRemaining = 600;
        render();
      }
    }

    function handleEndGame() {
      state.isPlaying = false;
      state.isPaused = false;
      if (timerInterval) clearInterval(timerInterval);
      alert('比赛已结束！');
      render();
    }

    function handleResetGame() {
      if (confirm('确定要重置比赛吗？所有数据将被清除。')) {
        state.isPlaying = false;
        state.isPaused = false;
        state.currentQuarter = 1;
        state.timeRemaining = 600;
        state.homeScore = 0;
        state.awayScore = 0;
        state.playerStats = new Map();
        state.events = [];
        state.totalGameTime = 0;
        state.quarterStats = [
          { rebounds: 0, assists: 0, turnovers: 0, fouls: 0 },
          { rebounds: 0, assists: 0, turnovers: 0, fouls: 0 },
          { rebounds: 0, assists: 0, turnovers: 0, fouls: 0 },
          { rebounds: 0, assists: 0, turnovers: 0, fouls: 0 },
        ];
        if (timerInterval) clearInterval(timerInterval);
        render();
      }
    }

    function handleTogglePlaying(playerId) {
      const player = state.players.find(p => p.id === playerId);
      if (player) {
        player.isPlaying = !player.isPlaying;
        render();
      }
    }

    function handleDeletePlayer(playerId) {
      if (confirm('确定要删除这名球员吗？')) {
        state.players = state.players.filter(p => p.id !== playerId);
        render();
      }
    }

    function handleEditPlayer(player) {
      editingPlayer = player;
      formData = {
        name: player.name,
        number: player.number.toString(),
        position: player.position,
      };
      showModal = true;
      render();
    }

    function handleAddPlayer() {
      editingPlayer = null;
      formData = { name: '', number: '', position: 'PG' };
      showModal = true;
      render();
    }

    function handleSubmit(e) {
      e.preventDefault();
      
      if (editingPlayer) {
        const player = state.players.find(p => p.id === editingPlayer.id);
        if (player) {
          player.name = formData.name;
          player.number = parseInt(formData.number);
          player.position = formData.position;
        }
      } else {
        state.players.push({
          id: generateId(),
          name: formData.name,
          number: parseInt(formData.number),
          position: formData.position,
          isPlaying: false,
        });
      }
      
      showModal = false;
      editingPlayer = null;
      formData = { name: '', number: '', position: 'PG' };
      render();
    }

    let substitutePlayerId = null;

    function showSubstituteModal(playerId) {
      substitutePlayerId = playerId;
      render();
    }

    function handleSubstitute(newPlayerId) {
      if (substitutePlayerId && newPlayerId) {
        const oldPlayer = state.players.find(p => p.id === substitutePlayerId);
        const newPlayer = state.players.find(p => p.id === newPlayerId);
        
        if (oldPlayer && newPlayer) {
          oldPlayer.isPlaying = false;
          newPlayer.isPlaying = true;
        }
      }
      substitutePlayerId = null;
      render();
    }

    function getTeamStats() {
      const teamStats = {
        totalPoints: 0,
        twoPointMade: 0,
        twoPointAttempt: 0,
        threePointMade: 0,
        threePointAttempt: 0,
        freeThrowMade: 0,
        freeThrowAttempt: 0,
        assists: 0,
        rebounds: 0,
        steals: 0,
        turnovers: 0,
      };

      state.playerStats.forEach(stats => {
        teamStats.totalPoints += calculateTotalPoints(stats);
        teamStats.twoPointMade += stats.twoPointMade;
        teamStats.twoPointAttempt += stats.twoPointAttempt;
        teamStats.threePointMade += stats.threePointMade;
        teamStats.threePointAttempt += stats.threePointAttempt;
        teamStats.freeThrowMade += stats.freeThrowMade;
        teamStats.freeThrowAttempt += stats.freeThrowAttempt;
        teamStats.assists += stats.assist;
        teamStats.rebounds += calculateTotalRebounds(stats);
        teamStats.steals += stats.steal;
        teamStats.turnovers += stats.turnover;
      });

      return teamStats;
    }

    function render() {
      const root = document.getElementById('root');
      
      let content = '';
      
      if (state.view === 'setup') {
        content = renderPlayerManager();
      } else if (state.view === 'game') {
        content = renderGameBoard();
      } else if (state.view === 'stats') {
        content = renderStatsPanel();
      } else if (state.view === 'court') {
        content = renderCourtView();
      }

      root.innerHTML = `
        <div class="app">
          <header class="app-header">
            <h1>🏀 篮球教练计分系统</h1>
            <nav class="nav-tabs">
              <button class="${state.view === 'setup' ? 'active' : ''}" onclick="state.view='setup'; render();">球员设置</button>
              <button class="${state.view === 'game' ? 'active' : ''}" onclick="state.view='game'; render();">比赛计分</button>
              <button class="${state.view === 'court' ? 'active' : ''}" onclick="state.view='court'; render();">球场视图</button>
              <button class="${state.view === 'stats' ? 'active' : ''}" onclick="state.view='stats'; render();">数据统计</button>
            </nav>
            ${state.isPlaying ? '<button class="btn-reset" onclick="handleResetGame()">重置比赛</button>' : ''}
          </header>
          <main class="app-main">
            ${content}
          </main>
        </div>
        ${showModal ? renderModal() : ''}
        ${substitutePlayerId ? renderSubstituteModal() : ''}
      `;
    }

    function renderModal() {
      return `
        <div class="modal-overlay" onclick="if(event.target===this){showModal=false; render();}">
          <div class="modal">
            <h3>${editingPlayer ? '编辑球员' : '添加球员'}</h3>
            <form onsubmit="handleSubmit(event)">
              <div class="form-group">
                <label>球衣号码</label>
                <input type="number" id="formNumber" value="${formData.number}" required min="0" max="99" onchange="formData.number=this.value">
              </div>

              </div>
              <div class="form-group">
                <label>位置</label>
                <select id="formPosition" onchange="formData.position=this.value">
                  ${['PG', 'SG', 'SF', 'PF', 'C'].map(pos => `<option value="${pos}" ${formData.position === pos ? 'selected' : ''}>${pos}</option>`).join('')}
                </select>
              </div>
              <div class="form-actions">
                <button type="button" class="btn-secondary" onclick="showModal=false; render();">取消</button>
                <button type="submit" class="btn-primary">${editingPlayer ? '保存' : '添加'}</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderSubstituteModal() {
      const currentPlayer = state.players.find(p => p.id === substitutePlayerId);
      const benchPlayers = state.players.filter(p => !p.isPlaying && p.id !== substitutePlayerId);
      
      return `
        <div class="modal-overlay" onclick="if(event.target===this){substitutePlayerId=null; render();}">
          <div class="modal">
            <h3>换人 - 替换 #${currentPlayer?.number} ${currentPlayer?.name}</h3>
            ${benchPlayers.length === 0

              : `<div style="display: flex; flex-direction: column; gap: 0.5rem; max-height: 400px; overflow-y: auto;">
                  ${benchPlayers.map(p => `
                    <button class="btn-secondary" style="text-align: left; padding: 1rem;" onclick="handleSubstitute('${p.id}')">
                      #${p.number} ${p.name} (${p.position})
                    </button>
                  `).join('')}
                </div>`
            }
            <div class="form-actions" style="margin-top: 1rem;">
              <button type="button" class="btn-secondary" onclick="substitutePlayerId=null; render();">取消</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderPlayerManager() {
      return `
        <div class="player-manager">
          <div class="manager-header">
            <h2>球员管理</h2>
            <button class="btn-primary" onclick="handleAddPlayer()">+ 添加球员</button>
          </div>
          <div class="player-list">
            ${state.players.length === 0 
              ? '<p class="empty-message">暂无球员，请添加球员</p>'
              : state.players.map(player => `
                  <div class="player-card ${player.isPlaying ? 'playing' : ''}">

                    </div>
                  </div>

            }
          </div>
        </div>
      `;
    }

          <div class="game-header">

              <div class="team-score home">

                <div class="score">${state.homeScore}</div>

            </div>
            <div class="game-controls">

                            <button class="event-btn danger" onclick="handleRecordEvent('${player.id}', '${EventType.TWO_POINT_MISS}')">✖️ 2分不</button>
                            <button class="event-btn success" onclick="handleRecordEvent('${player.id}', '${EventType.THREE_POINT_MADE}')">🎯 3分中</button>
                            <button class="event-btn danger" onclick="handleRecordEvent('${player.id}', '${EventType.THREE_POINT_MISS}')">✖️ 3分不</button>
                            <button class="event-btn success" onclick="handleRecordEvent('${player.id}', '${EventType.FREE_THROW_MADE}')">⚪ 罚中</button>

                            <button class="event-btn neutral" onclick="handleRecordEvent('${player.id}', '${EventType.STEAL}')">⚡ 抢断</button>
                            <button class="event-btn neutral" onclick="handleRecordEvent('${player.id}', '${EventType.BLOCK}')">🛡️ 盖帽</button>
                            <button class="event-btn warning" onclick="handleRecordEvent('${player.id}', '${EventType.TURNOVER}')">⚠️ 失误</button>
                            <button class="event-btn warning" onclick="handleRecordEvent('${player.id}', '${EventType.FOUL}')">🚫 犯规</button>
                          </div>
                          <div class="player-quick-stats">

                            <span>篮板: ${calculateTotalRebounds(stats)}</span>
                            <span>助攻: ${stats.assist}</span>
                            <span>抢断: ${stats.steal}</span>
                            <span>盖帽: ${stats.block}</span>
                            <span class="stat-bad">失误: ${stats.turnover}</span>
                            <span class="stat-bad">犯规: ${stats.foul}</span>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>`
              }
            </div>
            <div class="opponent-section">

                <button class="opponent-btn" onclick="handleOpponentScore(2)">🏀 2分 +2</button>
                <button class="opponent-btn" onclick="handleOpponentScore(3)">🎯 3分 +3</button>

              <div class="game-log-section">
                <h4>比赛动态</h4>
                <div class="game-log-list">
                  ${(state.gameLog || []).slice(0, 15).map(log => `
                    <div class="log-item log-${log.type}">
                      <span class="log-time">${log.time}</span>
                      <span class="log-text">${log.text}</span>

                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderCourtView() {
      const teamStats = getTeamStats();
      
      const paintPct = calculatePercentage(teamStats.twoPointMade, teamStats.twoPointAttempt);
      const threePct = calculatePercentage(teamStats.threePointMade, teamStats.threePointAttempt);
      const ftPct = calculatePercentage(teamStats.freeThrowMade, teamStats.freeThrowAttempt);

      return `
        <div class="court-panel">
          <h2>球场投篮分布</h2>
          <div class="court-container">
            <div class="court-svg-container">
              <svg viewBox="0 0 470 390" style="width: 100%; height: auto; background: var(--bg-card); border-radius: 12px;">
                <!-- 球场背景 -->
                <rect x="10" y="10" width="450" height="370" fill="none" stroke="#64748B" stroke-width="2"/>
                
                <!-- 中线 -->
                <line x1="235" y1="10" x2="235" y2="380" stroke="#64748B" stroke-width="2"/>
                
                <!-- 中圈 -->
                <circle cx="235" cy="195" r="40" fill="none" stroke="#64748B" stroke-width="2"/>
                
                <!-- 左半场三分线 -->
                <path d="M 30 10 L 30 380" stroke="#64748B" stroke-width="2" fill="none"/>
                <path d="M 30 95 Q 130 195 30 295" stroke="#64748B" stroke-width="2" fill="none"/>
                
                <!-- 左半场罚球区 -->
                <rect x="30" y="135" width="90" height="120" fill="none" stroke="#64748B" stroke-width="2"/>
                <circle cx="105" cy="195" r="30" fill="none" stroke="#64748B" stroke-width="2"/>
                
                <!-- 左半场篮筐 -->
                <circle cx="50" cy="195" r="10" fill="none" stroke="#FF6B35" stroke-width="3"/>
                
                <!-- 右半场三分线 -->
                <path d="M 440 10 L 440 380" stroke="#64748B" stroke-width="2" fill="none"/>
                <path d="M 440 95 Q 340 195 440 295" stroke="#64748B" stroke-width="2" fill="none"/>
                
                <!-- 右半场罚球区 -->
                <rect x="350" y="135" width="90" height="120" fill="none" stroke="#64748B" stroke-width="2"/>
                <circle cx="365" cy="195" r="30" fill="none" stroke="#64748B" stroke-width="2"/>
                
                <!-- 右半场篮筐 -->
                <circle cx="420" cy="195" r="10" fill="none" stroke="#FF6B35" stroke-width="3"/>
                
                <!-- 投篮数据标注 - 罚球区 -->
                <g>
                  <rect x="75" y="180" width="60" height="30" fill="rgba(16, 185, 129, 0.2)" rx="4"/>
                  <text x="105" y="200" text-anchor="middle" fill="var(--text-primary)" font-size="12" font-weight="bold">油漆区</text>
                  <text x="105" y="215" text-anchor="middle" fill="var(--primary)" font-size="10">${teamStats.twoPointMade}/${teamStats.twoPointAttempt} (${paintPct}%)</text>
                </g>
                
                <!-- 投篮数据标注 - 三分线 -->
                <g>
                  <rect x="30" y="30" width="80" height="50" fill="rgba(255, 107, 53, 0.2)" rx="4"/>
                  <text x="70" y="50" text-anchor="middle" fill="var(--text-primary)" font-size="12" font-weight="bold">左侧三分</text>
                  <text x="70" y="68" text-anchor="middle" fill="var(--primary)" font-size="10">${teamStats.threePointMade}/${teamStats.threePointAttempt} (${threePct}%)</text>
                </g>
                
                <g>
                  <rect x="360" y="30" width="80" height="50" fill="rgba(255, 107, 53, 0.2)" rx="4"/>
                  <text x="400" y="50" text-anchor="middle" fill="var(--text-primary)" font-size="12" font-weight="bold">右侧三分</text>
                  <text x="400" y="68" text-anchor="middle" fill="var(--primary)" font-size="10">${teamStats.threePointMade}/${teamStats.threePointAttempt} (${threePct}%)</text>
                </g>
                
                <!-- 罚球数据 -->
                <g>
                  <rect x="15" y="165" width="50" height="60" fill="rgba(245, 158, 11, 0.2)" rx="4"/>
                  <text x="40" y="185" text-anchor="middle" fill="var(--text-primary)" font-size="11" font-weight="bold">罚球</text>
                  <text x="40" y="205" text-anchor="middle" fill="var(--primary)" font-size="10">${teamStats.freeThrowMade}/${teamStats.freeThrowAttempt}</text>
                  <text x="40" y="218" text-anchor="middle" fill="var(--text-secondary)" font-size="9">${ftPct}%</text>
                </g>
                
                <!-- 总得分标注 -->
                <g>
                  <rect x="190" y="300" width="90" height="50" fill="rgba(255, 107, 53, 0.3)" rx="8"/>
                  <text x="235" y="322" text-anchor="middle" fill="var(--text-primary)" font-size="12" font-weight="bold">总得分</text>
                  <text x="235" y="342" text-anchor="middle" fill="var(--primary)" font-size="20" font-weight="bold">${state.homeScore}</text>
                </g>
              </svg>
            </div>
            
            <div class="court-stats">
              <h3>区域统计</h3>
              <div class="zone-stats">
                <div class="zone-stat">
                  <span class="zone-name">🏀 油漆区</span>
                  <div class="zone-data">
                    <div class="zone-makes">${teamStats.twoPointMade}/${teamStats.twoPointAttempt}</div>
                    <div class="zone-percent">${paintPct}%</div>
                  </div>
                </div>
                <div class="zone-stat">
                  <span class="zone-name">🎯 三分线</span>
                  <div class="zone-data">
                    <div class="zone-makes">${teamStats.threePointMade}/${teamStats.threePointAttempt}</div>
                    <div class="zone-percent">${threePct}%</div>
                  </div>
                </div>
                <div class="zone-stat">
                  <span class="zone-name">⚪ 罚球线</span>
                  <div class="zone-data">
                    <div class="zone-makes">${teamStats.freeThrowMade}/${teamStats.freeThrowAttempt}</div>
                    <div class="zone-percent">${ftPct}%</div>
                  </div>
                </div>
                <div class="zone-stat">
                  <span class="zone-name">📊 总篮板</span>
                  <div class="zone-data">
                    <div class="zone-makes">${teamStats.rebounds}</div>
                    <div class="zone-percent">进攻 ${state.players.reduce((sum, p) => sum + (state.playerStats.get(p.id)?.offensiveRebound || 0), 0)}</div>
                  </div>
                </div>
                <div class="zone-stat">
                  <span class="zone-name">🤝 助攻</span>
                  <div class="zone-data">
                    <div class="zone-makes">${teamStats.assists}</div>
                    <div class="zone-percent">全队</div>
                  </div>
                </div>
                <div class="zone-stat">
                  <span class="zone-name">⚡ 抢断</span>
                  <div class="zone-data">
                    <div class="zone-makes">${teamStats.steals}</div>
                    <div class="zone-percent">防守</div>
                  </div>
                </div>
                <div class="zone-stat">
                  <span class="zone-name">⚠️ 失误</span>
                  <div class="zone-data">
                    <div class="zone-makes" style="color: var(--danger)">${teamStats.turnovers}</div>
                    <div class="zone-percent">需控制</div>
                  </div>
                </div>
              </div>
              
              <h3 style="margin-top: 1.5rem; margin-bottom: 0.75rem;">球员得分榜</h3>
              <div class="player-score-list">
                ${state.players
                  .map(p => {
                    const s = state.playerStats.get(p.id) || createEmptyStats(p.id);
                    return { player: p, stats: s, points: calculateTotalPoints(s) };
                  })
                  .sort((a, b) => b.points - a.points)
                  .map((item, idx) => `
                    <div class="player-score-item">
                      <div class="player-rank">#${idx + 1}</div>
                      <div class="player-info-inline">
                        <span class="player-num">#${item.player.number}</span>
                        <span class="player-nm">${item.player.name}</span>
                      </div>
                      <div class="player-score-detail">
                        <span class="total-pts">${item.points}分</span>
                        <span class="score-breakdown">
                          ${item.stats.twoPointMade > 0 ? `<span class="two-pt">${item.stats.twoPointMade}×2</span>` : ''}
                          ${item.stats.threePointMade > 0 ? `<span class="three-pt">${item.stats.threePointMade}×3</span>` : ''}
                          ${item.stats.freeThrowMade > 0 ? `<span class="ft-pt">${item.stats.freeThrowMade}×1</span>` : ''}
                        </span>
                      </div>
                    </div>
                  `).join('')
                }
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderStatsPanel() {
      const statsData = state.players.map(player => {
        const stats = state.playerStats.get(player.id) || createEmptyStats(player.id);
        return {
          player,
          stats,
          points: calculateTotalPoints(stats),
          fg: calculateFieldGoalPercentage(stats),
          efg: calculateEFG(stats),
          tov: calculateTurnoverRate(stats),
          orb: calculateOffensiveReboundRate(stats),
          ftr: calculateFreeThrowRate(stats),
          twoP: calculatePercentage(stats.twoPointMade, stats.twoPointAttempt),
          threeP: calculatePercentage(stats.threePointMade, stats.threePointAttempt),
          ft: calculatePercentage(stats.freeThrowMade, stats.freeThrowAttempt),
          reb: calculateTotalRebounds(stats),
        };
      }).sort((a, b) => b.points - a.points);

      return `
        <div class="stats-panel">
          <h2>详细统计</h2>
          <div class="stats-table-wrapper">
            <table class="stats-table">
              <thead>
                <tr>
                  <th>球员</th>
                  <th>得分</th>
                  <th>2分</th>
                  <th>2分%</th>
                  <th>3分</th>
                  <th>3分%</th>
                  <th>罚球</th>
                  <th>罚球%</th>
                  <th>投篮%</th>
                  <th class="advanced-header">有效%</th>
                  <th class="advanced-header">失误率</th>
                  <th class="advanced-header">进板率</th>
                  <th class="advanced-header">罚球率</th>
                  <th>篮板</th>
                  <th>助攻</th>
                  <th>抢断</th>
                  <th>盖帽</th>
                  <th>失误</th>
                  <th>犯规</th>
                </tr>
              </thead>
              <tbody>
                ${statsData.map(({ player, stats, points, fg, efg, tov, orb, ftr, twoP, threeP, ft, reb }) => `
                  <tr>
                    <td><span class="player-cell">#${player.number} ${player.name}</span></td>
                    <td class="highlight">${points}</td>
                    <td>${stats.twoPointMade}/${stats.twoPointAttempt}</td>
                    <td>${twoP}%</td>
                    <td>${stats.threePointMade}/${stats.threePointAttempt}</td>
                    <td>${threeP}%</td>
                    <td>${stats.freeThrowMade}/${stats.freeThrowAttempt}</td>
                    <td>${ft}%</td>
                    <td>${fg}%</td>
                    <td class="highlight">${efg}%</td>
                    <td class="negative">${tov}%</td>
                    <td>${orb}%</td>
                    <td>${ftr}</td>
                    <td>${reb}</td>
                    <td>${stats.assist}</td>
                    <td>${stats.steal}</td>
                    <td>${stats.block}</td>
                    <td class="negative">${stats.turnover}</td>
                    <td class="negative">${stats.foul}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
